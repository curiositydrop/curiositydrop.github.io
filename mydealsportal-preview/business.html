<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Business | MyDealsPortal</title><link rel="stylesheet" href="styles.css"></head><body><div id="nav"></div><section class="section"><div class="wrap"><div id="profile"></div><h2 style="margin-top:34px">Current deals</h2><div class="grid" id="grid"></div></div></section><div id="footer"></div><script src="app.js"></script><script>document.getElementById("nav").innerHTML=nav();document.getElementById("footer").innerHTML=footer();const name=new URLSearchParams(location.search).get("name")||"";const list=businessDeals(name);const first=list[0];const b=businessInfo(name);if(!first&&!b){profile.innerHTML='<div class="panel"><h2>Business not found</h2></div>'}else{const loc=(b&&b.city?b.city:(first?first.city:""))+" · "+(b&&b.zip?b.zip:(first?first.zip:""));document.title=name+" | MyDealsPortal";profile.innerHTML='<div class="panel"><div class="profile-head"><div class="logo">'+esc(name.slice(0,2).toUpperCase())+'</div><div><div class="eyebrow">Business profile</div><h1 style="font-size:2.2rem;margin:6px 0">'+esc(name)+'</h1><div class="meta">'+esc(loc)+'</div></div></div><div class="actions" style="margin-top:20px">'+(b&&b.website?'<a class="btn btn-primary" href="'+esc(b.website)+'" target="_blank" rel="sponsored noopener">Visit Website</a>':'')+(b&&b.phone?'<a class="btn btn-ghost" href="tel:'+esc(b.phone)+'">Call Business</a>':'')+'</div></div>';grid.innerHTML=list.length?list.map(dealCard).join(""):'<div class="panel">No active deals right now.</div>'}</script></body></html>
