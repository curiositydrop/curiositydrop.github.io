<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Business | MyDealsPortal</title><link rel="stylesheet" href="styles.css"></head><body><div id="nav"></div><section class="section"><div class="wrap"><div id="profile"><div class="panel">Loading business...</div></div><h2 style="margin-top:34px">Current deals</h2><div class="grid" id="grid"></div></div></section><div id="footer"></div><script src="app.js"></script><script type="module">import {getBusinessById,getBusinessByName,getPublicDeals} from "./firebase-client.js";document.getElementById("nav").innerHTML=nav();document.getElementById("footer").innerHTML=footer();const params=new URLSearchParams(location.search);const id=params.get("id")||"";const name=params.get("name")||"";let b=null,list=[];try{b=id?await getBusinessById(id):await getBusinessByName(name);if(b){const deals=await getPublicDeals();list=deals.filter(d=>d.businessId===b.id||d.business===b.name)}}catch(e){console.warn(e)}if(!b){const fallback=businessDeals(name),first=fallback[0],local=businessInfo(name);if(!first&&!local){profile.innerHTML='<div class="panel"><h2>Business not found</h2></div>'}else{b=local||{name,city:first.city,zip:first.zip,category:first.category,sample:first.sample===true};list=fallback}}if(b){document.title=b.name+" | MyDealsPortal";profile.innerHTML='<div class="panel"><div class="profile-head"><div class="logo">'+esc(b.name.slice(0,2).toUpperCase())+'</div><div><div class="eyebrow">Business profile</div><h1 style="font-size:2.2rem;margin:6px 0">'+esc(b.name)+'</h1><div class="meta">'+esc((b.city||"")+" · "+(b.zip||""))+'</div></div></div><div class="actions" style="margin-top:20px">'+(b.website?'<a class="btn btn-primary" href="'+esc(b.website)+'" target="_blank" rel="sponsored noopener">Visit Website</a>':'')+(b.phone?'<a class="btn btn-ghost" href="tel:'+esc(b.phone)+'">Call Business</a>':'')+'</div></div>';grid.innerHTML=list.length?list.map(dealCard).join(""):'<div class="panel">No active deals right now.</div>'}</script></body></html>
