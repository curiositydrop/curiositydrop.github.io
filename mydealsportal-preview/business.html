<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Business | MyDealsPortal</title><link rel="stylesheet" href="styles.css"></head><body><div id="nav"></div><section class="section"><div class="wrap"><div id="profile"></div><h2 style="margin-top:34px">Current deals</h2><div class="grid" id="grid"></div></div></section><div id="footer"></div><script src="app.js"></script><script>document.getElementById("nav").innerHTML=nav();document.getElementById("footer").innerHTML=footer();const name=new URLSearchParams(location.search).get("name")||"";const list=businessDeals(name);const first=list[0];if(!first){profile.innerHTML='<div class="panel"><h2>Business not found</h2></div>'}else{document.title=name+" | MyDealsPortal";profile.innerHTML='<div class="panel profile-head"><div class="logo">'+esc(name.slice(0,2).toUpperCase())+'</div><div><div class="eyebrow">Business profile</div><h1 style="font-size:2.2rem;margin:6px 0">'+esc(name)+'</h1><div class="meta">'+esc(first.city)+' · '+esc(first.zip)+' · '+esc(first.category)+'</div></div></div>';grid.innerHTML=list.map(dealCard).join("")}</script></body></html>
