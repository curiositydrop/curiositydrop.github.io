<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Business Dashboard | MyDealsPortal</title><link rel="stylesheet" href="styles.css"></head><body><div id="nav"></div><section class="section"><div class="wrap"><div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap"><h1 style="font-size:2.6rem">Business Dashboard</h1><button class="btn btn-ghost" id="logout">Log Out</button></div><div id="loading" class="panel">Loading your account...</div><div class="portal" id="portal" style="display:none"><div class="panel"><h3>Your subscription</h3><div class="pricebox">$44.99<span>/month</span></div><p class="tiny"><b>Founding 100 sandbox rate</b> · Months 2 & 3 free · Rate stays locked while continuously subscribed.</p><p><b>Unlimited deals included</b></p><p class="tiny">Stripe subscription activation comes next.</p><hr style="border:0;border-top:1px solid var(--line);margin:20px 0"><h3>Your business</h3><div id="bizInfo"></div><hr style="border:0;border-top:1px solid var(--line);margin:20px 0"><h3>Your deals</h3><div id="businessDeals"></div></div><div class="panel"><h3 id="formTitle">Add a deal</h3><div class="formgrid"><div><label class="label">Deal title</label><input id="pTitle"></div><div><label class="label">Category</label><select id="pCategory"><option>Home Services</option><option>Restaurants</option><option>Automotive</option><option>Health & Beauty</option><option>Retail</option></select></div><div><label class="label">ZIP code</label><input id="pZip"></div><div><label class="label">City, State</label><input id="pCity"></div><div><label class="label">Deal value</label><input id="pPrice" placeholder="Save 20%"></div><div class="full"><label class="label">Description</label><textarea id="pDescription" rows="4"></textarea></div><div class="full"><label class="label">Expiration or terms</label><input id="pTerms"></div></div><div class="actions"><button class="btn btn-primary" id="save">Save Deal</button><button class="btn btn-ghost" id="clear">Clear</button></div><p id="msg" class="tiny"></p></div></div></div></section><div id="footer"></div><script src="app.js"></script><script type="module">
import {waitForUser,getMyBusiness,getMyDeals,saveDeal,setDealActive,removeDeal,logoutBusiness} from "./firebase-client.js";
document.getElementById("nav").innerHTML=nav();document.getElementById("footer").innerHTML=footer();
let editing=null,biz=null,deals=[];
const user=await waitForUser();if(!user){location.href="login.html";throw new Error("not signed in")}
biz=await getMyBusiness(user.uid);if(!biz){loading.innerHTML='Business profile not found.';throw new Error("business missing")}
loading.style.display="none";portal.style.display="grid";bizInfo.innerHTML='<b>'+esc(biz.name)+'</b><div class="tiny">'+esc(user.email)+' · '+esc(biz.city||"")+' '+esc(biz.zip||"")+'</div>'+(biz.phone?'<div class="tiny">'+esc(biz.phone)+'</div>':'')+(biz.website?'<div class="tiny">'+esc(biz.website)+'</div>':'');
pCategory.value=biz.category||"Home Services";pZip.value=biz.zip||"";pCity.value=biz.city||"";
async function refresh(){deals=await getMyDeals(user.uid);businessDeals.innerHTML=deals.length?deals.map(d=>'<div class="dealrow"><div class="status">'+(d.active===false?'PAUSED':'ACTIVE')+'</div><h4>'+esc(d.title)+'</h4><div class="tiny">'+esc(d.category)+' · '+esc(d.zip)+'</div><div class="actions"><button class="btn btn-soft" data-edit="'+d.id+'">Edit</button><button class="btn btn-ghost" data-toggle="'+d.id+'">'+(d.active===false?'Reactivate':'Pause')+'</button><button class="btn btn-danger" data-delete="'+d.id+'">Delete</button>'+(d.active===false?'':'<a class="btn btn-ghost" href="deal.html?id='+encodeURIComponent(d.id)+'">View Live</a>')+'</div></div>').join(""):'<p class="tiny">No deals yet. Add your first one.</p>'}
businessDeals.onclick=async e=>{const id=e.target.dataset.edit||e.target.dataset.toggle||e.target.dataset.delete;if(!id)return;const d=deals.find(x=>x.id===id);if(e.target.dataset.edit){editing=id;formTitle.textContent="Edit deal";pTitle.value=d.title;pCategory.value=d.category;pZip.value=d.zip;pCity.value=d.city;pPrice.value=d.price;pDescription.value=d.description;pTerms.value=d.terms}else if(e.target.dataset.toggle){await setDealActive(id,d.active===false);await refresh()}else if(e.target.dataset.delete){if(confirm("Delete this deal?")){await removeDeal(id);await refresh()}}};
function clearForm(){editing=null;formTitle.textContent="Add a deal";pTitle.value="";pCategory.value=biz.category||"Home Services";pZip.value=biz.zip||"";pCity.value=biz.city||"";pPrice.value="";pDescription.value="";pTerms.value=""}
save.onclick=async()=>{if(!pTitle.value.trim()||!pZip.value.trim())return alert("Add a deal title and ZIP code.");save.disabled=true;msg.textContent="Saving...";const old=editing?deals.find(x=>x.id===editing):null;try{await saveDeal(user.uid,biz,{title:pTitle.value.trim(),zip:pZip.value.trim(),city:pCity.value.trim()||"Local area",category:pCategory.value,price:pPrice.value.trim()||"Special offer",description:pDescription.value.trim()||"Local business deal.",terms:pTerms.value.trim()||"See business for details.",active:old?old.active!==false:true},editing);clearForm();await refresh();msg.textContent="Saved."}catch(e){msg.textContent=e.message||"Could not save."}save.disabled=false};clear.onclick=clearForm;logout.onclick=async()=>{await logoutBusiness();location.href="login.html"};await refresh();
</script></body></html>
