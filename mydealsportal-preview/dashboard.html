<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Business Dashboard | MyDealsPortal</title><link rel="stylesheet" href="styles.css"></head><body><div id="nav"></div><section class="section"><div class="wrap"><h1 style="font-size:2.6rem">Business Dashboard</h1><div class="portal"><div class="panel"><h3>Your subscription</h3><div class="pricebox">$50<span>/month</span></div><p><b>Unlimited deals included</b></p><p class="tiny">No commission · No contract · Edit anytime · Cancel anytime</p><hr style="border:0;border-top:1px solid var(--line);margin:20px 0"><h3>Your business</h3><div id="bizInfo"></div><hr style="border:0;border-top:1px solid var(--line);margin:20px 0"><h3>Your deals</h3><div id="businessDeals"></div></div><div class="panel"><h3 id="formTitle">Add a deal</h3><div class="formgrid"><div><label class="label">Deal title</label><input id="pTitle"></div><div><label class="label">Category</label><select id="pCategory"><option>Home Services</option><option>Restaurants</option><option>Automotive</option><option>Health & Beauty</option><option>Retail</option></select></div><div><label class="label">Business name</label><input id="pBusiness"></div><div><label class="label">ZIP code</label><input id="pZip"></div><div><label class="label">City, State</label><input id="pCity"></div><div><label class="label">Deal value</label><input id="pPrice" placeholder="Save 20%"></div><div class="full"><label class="label">Description</label><textarea id="pDescription" rows="4"></textarea></div><div class="full"><label class="label">Expiration or terms</label><input id="pTerms"></div></div><div class="actions"><button class="btn btn-primary" id="save">Save Deal</button><button class="btn btn-ghost" id="clear">Clear</button></div><p class="tiny">Saved deals immediately appear on the public Deals page in this prototype.</p></div></div></div></section><div id="footer"></div><script src="app.js"></script><script>document.getElementById("nav").innerHTML=nav();document.getElementById("footer").innerHTML=footer();let editing=null;const biz=JSON.parse(localStorage.getItem("mdp_demo_business")||'{"name":"Your Business Name","email":"demo@example.com","zip":"04072","category":"Home Services","active":true}');bizInfo.innerHTML='<b>'+esc(biz.name)+'</b><div class="tiny">'+esc(biz.email)+' · '+esc(biz.zip)+'</div>';pBusiness.value=biz.name;pZip.value=biz.zip;pCategory.value=biz.category||"Home Services";function list(){const ds=customDeals().filter(d=>d.business===biz.name);businessDeals.innerHTML=ds.length?ds.map(d=>'<div class="dealrow"><div class="status">ACTIVE</div><h4>'+esc(d.title)+'</h4><div class="tiny">'+esc(d.category)+' · '+esc(d.zip)+'</div><div class="actions"><button class="btn btn-soft" onclick="editDeal(\''+d.id+'\')">Edit</button><button class="btn btn-danger" onclick="delDeal(\''+d.id+'\')">Delete</button><a class="btn btn-ghost" href="deal.html?id='+encodeURIComponent(d.id)+'">View Live</a></div></div>').join(""):'<p class="tiny">No deals yet. Add your first one.</p>'}function editDeal(id){const d=customDeals().find(x=>x.id===id);if(!d)return;editing=id;formTitle.textContent="Edit deal";pTitle.value=d.title;pCategory.value=d.category;pBusiness.value=d.business;pZip.value=d.zip;pCity.value=d.city;pPrice.value=d.price;pDescription.value=d.description;pTerms.value=d.terms;scrollTo({top:0,behavior:"smooth"})}function delDeal(id){if(!confirm("Delete this deal?"))return;localStorage.setItem("mdp_demo_deals",JSON.stringify(customDeals().filter(x=>x.id!==id)));list()}function clearForm(){editing=null;formTitle.textContent="Add a deal";pTitle.value="";pCategory.value=biz.category||"Home Services";pBusiness.value=biz.name;pZip.value=biz.zip;pCity.value="";pPrice.value="";pDescription.value="";pTerms.value=""}save.onclick=()=>{if(!pTitle.value.trim()||!pZip.value.trim())return alert("Add a deal title and ZIP code.");let ds=customDeals();const d={id:editing||("d"+Date.now()),title:pTitle.value.trim(),business:pBusiness.value.trim()||biz.name,zip:pZip.value.trim(),city:pCity.value.trim()||"Local area",category:pCategory.value,price:pPrice.value.trim()||"Special offer",description:pDescription.value.trim()||"Local business deal.",terms:pTerms.value.trim()||"See business for details.",created:Date.now()};ds=editing?ds.map(x=>x.id===editing?d:x):ds.concat(d);localStorage.setItem("mdp_demo_deals",JSON.stringify(ds));clearForm();list();alert("Deal saved and published.")};clear.onclick=clearForm;list();</script></body></html>
