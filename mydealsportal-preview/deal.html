<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Deal | MyDealsPortal</title><link rel="stylesheet" href="styles.css"></head><body><div id="nav"></div><section class="section"><div class="wrap" id="content"><div class="panel">Loading deal...</div></div></section><div id="footer"></div><script src="app.js"></script><script type="module">
import {getDealById,getBusinessById,getBusinessByName} from "./firebase-client.js";
document.getElementById("nav").innerHTML=nav();
document.getElementById("footer").innerHTML=footer();
const id=new URLSearchParams(location.search).get("id");
let d=null,b=null;
try{
  d=await getDealById(id);
  if(d)b=d.businessId?await getBusinessById(d.businessId):await getBusinessByName(d.business);
}catch(e){console.warn(e)}
if(!d)d=getDeal(id);
if(d&&!b)b=businessInfo(d.business);
if(!d||d.active===false){
  content.innerHTML='<div class="panel"><h2>This deal is not currently active.</h2><a class="btn btn-primary" href="'+MDP_BASE+'">Browse active deals</a></div>';
}else{
  const businessUrl=d.businessId?MDP_BASE+'business.html?id='+encodeURIComponent(d.businessId):MDP_BASE+'business.html?name='+encodeURIComponent(d.business);
  document.title=d.title+" | MyDealsPortal";
  content.innerHTML='<div class="detail"><div class="panel"><span class="pill">'+esc(d.category)+'</span><h1 class="bigdeal">'+esc(d.title)+'</h1><div class="business">'+esc(d.business)+'</div><div class="meta">'+esc(d.city)+' · '+esc(d.zip)+'</div><div class="price">'+esc(d.price)+'</div><p style="font-size:1.08rem;line-height:1.65">'+esc(d.description)+'</p><div class="note"><b>Terms:</b> '+esc(d.terms)+'</div><div class="actions"><button class="btn btn-primary" id="claimDealBtn">Claim This Deal</button>'+(b&&b.website?'<a class="btn btn-soft" href="'+esc(b.website)+'" target="_blank" rel="sponsored noopener">Visit Business</a>':'<a class="btn btn-soft" href="'+businessUrl+'">View Business</a>')+'<a class="btn btn-ghost" href="'+businessUrl+'">More from this business</a><a class="btn btn-ghost" href="'+MDP_BASE+'contact.html?reason=report&deal='+encodeURIComponent(d.title)+'">Report Deal</a></div><div id="claimBox" class="claim-box" style="display:none"></div></div><aside class="panel"><h3>Business</h3><p><b>'+esc(d.business)+'</b></p><p class="tiny">'+esc(d.city)+' · '+esc(d.zip)+'</p><a class="btn btn-soft" href="'+businessUrl+'">View business profile</a></aside></div>';
  const claimBtn=document.getElementById("claimDealBtn");
  const claimBox=document.getElementById("claimBox");
  const key="mdp_claim_"+d.id;
  function renderClaim(){
    const saved=localStorage.getItem(key);
    if(!saved)return;
    const data=JSON.parse(saved);
    claimBtn.textContent="Deal Claimed";
    claimBtn.disabled=true;
    claimBox.style.display="block";
    claimBox.innerHTML='<div class="claim-label">YOUR CLAIM CODE</div><div class="claim-code">'+esc(data.code)+'</div><div class="tiny">Claimed '+esc(data.when)+'</div><p>Show this screen to the business when redeeming the offer.</p>';
  }
  claimBtn.addEventListener("click",()=>{
    if(!localStorage.getItem(key)){
      const code="MDP-"+Math.random().toString(36).slice(2,8).toUpperCase();
      localStorage.setItem(key,JSON.stringify({code,when:new Date().toLocaleString()}));
    }
    renderClaim();
  });
  renderClaim();
}
</script></body></html>
