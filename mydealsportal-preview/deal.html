<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Deal | MyDealsPortal</title><link rel="stylesheet" href="styles.css"></head><body><div id="nav"></div><section class="section"><div class="wrap" id="content"></div></section><div id="footer"></div><script src="app.js"></script><script>document.getElementById("nav").innerHTML=nav();document.getElementById("footer").innerHTML=footer();const id=new URLSearchParams(location.search).get("id");const d=getDeal(id);if(!d||d.active===false){content.innerHTML='<div class="panel"><h2>This deal is not currently active.</h2><a class="btn btn-primary" href="'+MDP_BASE+'">Browse active deals</a></div>'}else{const b=businessInfo(d.business);document.title=d.title+" | MyDealsPortal";content.innerHTML='<div class="detail"><div class="panel"><span class="pill">'+esc(d.category)+'</span><h1 class="bigdeal">'+esc(d.title)+'</h1><div class="business">'+esc(d.business)+'</div><div class="meta">'+esc(d.city)+' · '+esc(d.zip)+'</div><div class="price">'+esc(d.price)+'</div><p style="font-size:1.08rem;line-height:1.65">'+esc(d.description)+'</p><div class="note"><b>Terms:</b> '+esc(d.terms)+'</div><div class="actions">'+(b&&b.website?'<a class="btn btn-primary" href="'+esc(b.website)+'" target="_blank" rel="sponsored noopener">Visit Business</a>':'<a class="btn btn-primary" href="'+MDP_BASE+'business.html?name='+encodeURIComponent(d.business)+'">View Business</a>')+'<a class="btn btn-ghost" href="'+MDP_BASE+'business.html?name='+encodeURIComponent(d.business)+'">More from this business</a><a class="btn btn-ghost" href="'+MDP_BASE+'contact.html?reason=report&deal='+encodeURIComponent(d.title)+'">Report Deal</a></div></div><aside class="panel"><h3>Business</h3><p><b>'+esc(d.business)+'</b></p><p class="tiny">'+esc(d.city)+' · '+esc(d.zip)+'</p><a class="btn btn-soft" href="'+MDP_BASE+'business.html?name='+encodeURIComponent(d.business)+'">View business profile</a></aside></div>'}</script></body></html>
