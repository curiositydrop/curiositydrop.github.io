<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Business Login | MyDealsPortal</title><link rel="stylesheet" href="styles.css"></head><body><div id="nav"></div><section class="section"><div class="wrap" style="max-width:620px"><div class="panel"><div class="eyebrow">Business login</div><h2>Manage your deals</h2><label class="label">Email</label><input id="email" type="email" placeholder="you@business.com"><label class="label" style="margin-top:12px">Password</label><input id="pw" type="password" placeholder="••••••••"><div class="actions"><button class="btn btn-primary" id="login">Log In</button><a class="btn btn-ghost" href="advertise.html">Create Account</a></div><p id="status" class="tiny"></p></div></div></section><div id="footer"></div><script src="app.js"></script><script type="module">
import {loginBusiness} from "./firebase-client.js";
document.getElementById("nav").innerHTML=nav();
document.getElementById("footer").innerHTML=footer();
const loginBtn=document.getElementById("login");
const statusEl=document.getElementById("status");
const emailEl=document.getElementById("email");
const pwEl=document.getElementById("pw");
loginBtn.addEventListener("click",async()=>{
  statusEl.textContent="Signing in...";
  loginBtn.disabled=true;
  try{
    await loginBusiness(emailEl.value.trim(),pwEl.value);
    location.href="dashboard.html";
  }catch(e){
    console.error(e);
    statusEl.textContent="Login failed. Check your email and password.";
    loginBtn.disabled=false;
  }
});
</script></body></html>
