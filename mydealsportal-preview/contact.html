<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Contact | MyDealsPortal</title><link rel="stylesheet" href="styles.css"></head><body><div id="nav"></div><section class="section"><div class="wrap" style="max-width:720px"><div class="panel"><div class="eyebrow">Contact</div><h1 style="font-size:2.6rem">How can we help?</h1><div class="formgrid"><div><label class="label">Name</label><input id="n"></div><div><label class="label">Email</label><input id="e" type="email"></div><div class="full"><label class="label">Reason</label><select id="r"><option>General question</option><option>Business account help</option><option>Report a deal</option><option>Billing question</option><option>Technical problem</option></select></div><div class="full"><label class="label">Message</label><textarea id="m" rows="6"></textarea></div></div><div class="actions"><button class="btn btn-primary" onclick="send()">Send Message</button></div><p class="tiny">Prototype form only. Production will deliver these securely to the support inbox.</p></div></div></section><div id="footer"></div><script src="app.js"></script><script>document.getElementById("nav").innerHTML=nav();document.getElementById("footer").innerHTML=footer();function send(){if(!n.value.trim()||!e.value.trim()||!m.value.trim())return alert("Please complete your name, email, and message.");alert("Contact form flow works. Production email delivery will be connected before launch.");m.value=""}</script></body></html>
