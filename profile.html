<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile | BANDtroductions</title>
  <link rel="stylesheet" href="style.css?v=7">
  <link rel="stylesheet" href="auth.css?v=5">
</head>
<body class="hamburger-active auth-page">
  <div id="global-header"></div>

  <main class="auth-shell auth-shell-wide">
    <section id="profile-card" class="auth-form" hidden>
      <div style="display:flex; gap:20px; align-items:center; flex-wrap:wrap;">
        <img id="profile-image" alt="Profile image" hidden style="width:150px;height:150px;object-fit:cover;border-radius:18px;border:1px solid #00c8b4;">
        <div>
          <p id="profile-type" class="profile-meta" style="text-transform:uppercase;letter-spacing:.08em;color:#00c8b4;font-weight:800;"></p>
          <h1 id="profile-name" style="margin:0 0 8px;"></h1>
          <p id="profile-location" class="auth-subtitle" style="margin:0;"></p>
        </div>
      </div>

      <div style="margin-top:30px;">
        <h2>About</h2>
        <p id="profile-bio" style="white-space:pre-wrap;line-height:1.7;"></p>
      </div>

      <div id="profile-details" class="profile-details-grid" style="margin-top:28px;"></div>
      <div id="profile-links" style="display:flex;gap:12px;flex-wrap:wrap;margin-top:28px;"></div>

      <div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:32px;">
        <a id="edit-profile" class="auth-button" href="profile-setup.html" hidden style="text-decoration:none;justify-content:center;">Edit Profile</a>
        <button id="share-profile" class="auth-button" type="button" hidden>Share to BANDtroductions</button>
        <a class="auth-button auth-button-secondary" href="community.html" style="text-decoration:none;justify-content:center;">Back to Community</a>
      </div>

      <section id="share-panel" class="share-panel" hidden>
        <label>
          Add a message
          <textarea id="share-message" rows="3" maxlength="1000" placeholder="Tell the community why they should check out this profile..."></textarea>
        </label>
        <div style="display:flex;gap:12px;flex-wrap:wrap;">
          <button id="confirm-share" class="auth-button" type="button">Post to Community</button>
          <button id="cancel-share" class="auth-button auth-button-secondary" type="button">Cancel</button>
        </div>
        <p id="share-status" class="auth-message" role="status"></p>
      </section>
    </section>

    <p id="profile-status" class="auth-message">Loading profile…</p>
  </main>

  <div id="global-footer"></div>
  <script src="global.js?v=2"></script>
  <script type="module">
    import { auth, db } from './firebase-dev.js';
    import { onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js';
    import { addDoc, collection, doc, getDoc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js';

    const params = new URLSearchParams(window.location.search);
    const profileId = params.get('id');
    const card = document.getElementById('profile-card');
    const status = document.getElementById('profile-status');
    const shareButton = document.getElementById('share-profile');
    const sharePanel = document.getElementById('share-panel');
    const shareStatus = document.getElementById('share-status');
    let loadedProfile = null;
    let signedInUser = null;
    let signedInProfile = null;

    const detailGroups = {
      band: [['genre', 'Genre'], ['yearFormed', 'Year formed'], ['members', 'Members'], ['bookingEmail', 'Booking']],
      musician: [['instruments', 'Instrument(s)'], ['experience', 'Experience'], ['lookingForBand', 'Looking for a band']],
      venue: [['capacity', 'Capacity'], ['venueType', 'Venue type'], ['venueBooking', 'Booking information']],
      fan: [['favoriteGenres', 'Favorite genres'], ['fanInterests', 'Interests']]
    };

    function addDetail(label, value) {
      if (!value) return;
      const item = document.createElement('div');
      item.style.cssText = 'padding:16px;border:1px solid rgba(0,200,180,.28);border-radius:14px;background:#111;';
      const heading = document.createElement('strong');
      heading.textContent = label;
      heading.style.display = 'block';
      heading.style.color = '#00c8b4';
      heading.style.marginBottom = '6px';
      const text = document.createElement('span');
      text.textContent = value;
      item.append(heading, text);
      document.getElementById('profile-details').appendChild(item);
    }

    function addLink(label, url) {
      if (!url) return;
      const link = document.createElement('a');
      link.href = url;
      link.target = '_blank';
      link.rel = 'noopener';
      link.className = 'auth-button';
      link.style.textDecoration = 'none';
      link.textContent = label;
      document.getElementById('profile-links').appendChild(link);
    }

    async function loadProfile(user) {
      signedInUser = user;
      if (!profileId) {
        status.textContent = 'No profile was selected.';
        return;
      }

      try {
        const snapshot = await getDoc(doc(db, 'profiles', profileId));
        if (!snapshot.exists() || snapshot.data().published !== true) {
          status.textContent = 'This profile is not available.';
          return;
        }

        loadedProfile = snapshot.data();
        const accountType = loadedProfile.accountType || 'fan';
        document.title = `${loadedProfile.displayName} | BANDtroductions`;
        document.getElementById('profile-name').textContent = loadedProfile.displayName || 'BANDtroductions Member';
        document.getElementById('profile-type').textContent = accountType;
        document.getElementById('profile-location').textContent = loadedProfile.location || '';
        document.getElementById('profile-bio').textContent = loadedProfile.bio || '';

        if (loadedProfile.imageUrl) {
          const image = document.getElementById('profile-image');
          image.src = loadedProfile.imageUrl;
          image.hidden = false;
        }

        (detailGroups[accountType] || []).forEach(([key, label]) => addDetail(label, loadedProfile[key]));
        addLink('Visit Website', loadedProfile.website);
        addLink('Music / Video', loadedProfile.mediaLink);

        if (user) {
          const ownProfileSnapshot = await getDoc(doc(db, 'profiles', user.uid));
          const ownUserSnapshot = await getDoc(doc(db, 'users', user.uid));
          signedInProfile = ownProfileSnapshot.exists() ? ownProfileSnapshot.data() : (ownUserSnapshot.exists() ? ownUserSnapshot.data() : {});
          shareButton.hidden = false;
          if (user.uid === profileId) document.getElementById('edit-profile').hidden = false;
        }

        status.hidden = true;
        card.hidden = false;
      } catch (error) {
        console.error(error);
        status.textContent = 'We could not load this profile.';
      }
    }

    shareButton.addEventListener('click', () => {
      sharePanel.hidden = false;
      document.getElementById('share-message').focus();
    });

    document.getElementById('cancel-share').addEventListener('click', () => {
      sharePanel.hidden = true;
      shareStatus.textContent = '';
    });

    document.getElementById('confirm-share').addEventListener('click', async () => {
      if (!signedInUser || !signedInProfile || !loadedProfile) return;
      const button = document.getElementById('confirm-share');
      const customMessage = document.getElementById('share-message').value.trim();
      button.disabled = true;
      shareStatus.textContent = 'Sharing profile…';

      try {
        await addDoc(collection(db, 'posts'), {
          authorId: signedInUser.uid,
          authorName: signedInProfile.displayName || signedInUser.displayName || 'BANDtroductions Member',
          accountType: signedInProfile.accountType || 'member',
          category: 'shared-profile',
          content: customMessage || `Check out ${loadedProfile.displayName || 'this profile'} on BANDtroductions.`,
          linkUrl: `${window.location.origin}${window.location.pathname}?id=${encodeURIComponent(profileId)}`,
          imageUrl: '',
          sharedProfile: {
            id: profileId,
            displayName: loadedProfile.displayName || 'BANDtroductions Profile',
            accountType: loadedProfile.accountType || 'member',
            location: loadedProfile.location || '',
            genre: loadedProfile.genre || loadedProfile.favoriteGenres || '',
            imageUrl: loadedProfile.imageUrl || ''
          },
          published: true,
          createdAt: serverTimestamp(),
          updatedAt: serverTimestamp()
        });
        window.location.href = 'community.html';
      } catch (error) {
        console.error(error);
        shareStatus.textContent = error.code === 'permission-denied'
          ? 'Sharing permissions are not enabled yet.'
          : 'This profile could not be shared.';
        button.disabled = false;
      }
    });

    onAuthStateChanged(auth, (user) => loadProfile(user));
  </script>
</body>
</html>
