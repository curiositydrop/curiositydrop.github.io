<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile | BANDtroductions</title>
  <link rel="stylesheet" href="style.css?v=7">
  <link rel="stylesheet" href="auth.css?v=7">
  <style>
    .profile-page { display:grid; gap:22px; }
    .profile-hero { position:relative; overflow:hidden; border:1px solid rgba(0,200,180,.35); border-radius:24px; background:linear-gradient(145deg,#121212,#080808); box-shadow:0 18px 45px rgba(0,0,0,.35); }
    .profile-hero::before { content:""; position:absolute; inset:0; background:radial-gradient(circle at top right,rgba(0,200,180,.17),transparent 42%); pointer-events:none; }
    .profile-hero-inner { position:relative; display:grid; grid-template-columns:170px minmax(0,1fr); gap:26px; align-items:center; padding:30px; }
    .profile-avatar { width:160px; height:160px; display:flex; align-items:center; justify-content:center; border-radius:22px; border:1px solid rgba(0,200,180,.65); background:#090909; color:#00c8b4; font-size:2.65rem; font-weight:900; letter-spacing:.03em; overflow:hidden; }
    .profile-avatar img { width:100%; height:100%; object-fit:cover; }
    .profile-kicker { margin:0 0 8px; color:#00c8b4; font-weight:900; letter-spacing:.13em; text-transform:uppercase; font-size:.8rem; }
    .profile-title { margin:0; font-size:clamp(2rem,7vw,4.5rem); line-height:.95; text-wrap:balance; }
    .profile-location { margin:12px 0 0; color:#bbb; font-size:1.05rem; }
    .profile-badges { display:flex; gap:9px; flex-wrap:wrap; margin-top:18px; }
    .profile-badge { border:1px solid #3b3b3b; border-radius:999px; padding:7px 11px; background:#0b0b0b; color:#ddd; font-size:.82rem; font-weight:800; }
    .profile-layout { display:grid; grid-template-columns:minmax(0,1.7fr) minmax(260px,.8fr); gap:22px; }
    .profile-panel { border:1px solid rgba(255,255,255,.1); border-radius:20px; padding:24px; background:#101010; }
    .profile-panel h2 { margin:0 0 14px; }
    .profile-bio { margin:0; white-space:pre-wrap; line-height:1.75; color:#ddd; }
    .profile-details-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }
    .profile-detail { padding:16px; border:1px solid rgba(0,200,180,.25); border-radius:14px; background:#0b0b0b; }
    .profile-detail strong { display:block; color:#00c8b4; margin-bottom:6px; }
    .profile-actions,.profile-links { display:flex; gap:10px; flex-wrap:wrap; }
    .profile-links:empty { display:none; }
    .profile-side-note { color:#aaa; line-height:1.6; }
    .profile-type-band .profile-hero { border-color:rgba(0,200,180,.55); }
    .profile-type-musician .profile-hero { border-color:rgba(255,255,255,.2); }
    .profile-type-venue .profile-hero { border-color:rgba(255,184,77,.4); }
    .profile-type-fan .profile-hero { border-color:rgba(167,116,255,.4); }
    .share-panel { margin-top:22px; }
    @media (max-width:760px) {
      .profile-hero-inner { grid-template-columns:1fr; text-align:center; justify-items:center; padding:24px 18px; }
      .profile-avatar { width:132px; height:132px; }
      .profile-badges,.profile-actions,.profile-links { justify-content:center; }
      .profile-layout { grid-template-columns:1fr; }
      .profile-details-grid { grid-template-columns:1fr; }
    }
  </style>
</head>
<body class="hamburger-active auth-page">
  <div id="global-header"></div>

  <main class="auth-shell auth-shell-wide profile-page">
    <section id="profile-card" hidden>
      <div class="profile-hero">
        <div class="profile-hero-inner">
          <div id="profile-avatar" class="profile-avatar" aria-hidden="true">BT</div>
          <div>
            <p id="profile-type" class="profile-kicker"></p>
            <h1 id="profile-name" class="profile-title"></h1>
            <p id="profile-location" class="profile-location"></p>
            <div id="profile-badges" class="profile-badges"></div>
          </div>
        </div>
      </div>

      <div class="profile-layout">
        <div class="profile-panel">
          <h2 id="about-heading">About</h2>
          <p id="profile-bio" class="profile-bio"></p>
        </div>

        <aside class="profile-panel">
          <h2 id="snapshot-heading">Profile Snapshot</h2>
          <div id="profile-details" class="profile-details-grid"></div>
          <p id="empty-details" class="profile-side-note" hidden>This member has not added more profile details yet.</p>
        </aside>
      </div>

      <section class="profile-panel">
        <h2>Listen, Watch & Connect</h2>
        <div id="profile-links" class="profile-links"></div>
        <p id="empty-links" class="profile-side-note" hidden>No outside links have been added yet.</p>
      </section>

      <section class="profile-panel">
        <div class="profile-actions">
          <a id="edit-profile" class="auth-button" href="profile-setup.html" hidden style="text-decoration:none;justify-content:center;">Edit Profile</a>
          <button id="share-profile" class="auth-button" type="button" hidden>Share to BANDtroductions</button>
          <a class="auth-button auth-button-secondary" href="community.html" style="text-decoration:none;justify-content:center;">Back to Community</a>
        </div>

        <section id="share-panel" class="share-panel" hidden>
          <label>Add a message<textarea id="share-message" rows="3" maxlength="1000" placeholder="Tell the community why they should check out this profile..."></textarea></label>
          <div class="profile-actions">
            <button id="confirm-share" class="auth-button" type="button">Post to Community</button>
            <button id="cancel-share" class="auth-button auth-button-secondary" type="button">Cancel</button>
          </div>
          <p id="share-status" class="auth-message" role="status"></p>
        </section>
      </section>
    </section>

    <p id="profile-status" class="auth-message">Loading profile…</p>
  </main>

  <div id="global-footer"></div>
  <script src="global.js?v=5"></script>
  <script type="module">
    import { auth, db } from './firebase-dev.js';
    import { onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js';
    import { addDoc, collection, doc, getDoc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js';

    const params = new URLSearchParams(window.location.search);
    const profileId = params.get('id');
    const card = document.getElementById('profile-card');
    const status = document.getElementById('profile-status');
    const shareButton = document.getElementById('share-profile');
    const sharePanel = document.getElementById('share-panel');
    const shareStatus = document.getElementById('share-status');
    let loadedProfile = null;
    let signedInUser = null;
    let signedInProfile = null;

    const layouts = {
      band: {
        kicker: 'BAND PROFILE',
        about: 'About the Band',
        snapshot: 'Band Snapshot',
        details: [['genre','Genre'],['yearFormed','Year formed'],['members','Members'],['bookingEmail','Booking']],
        badges: ['genre','location']
      },
      musician: {
        kicker: 'MUSICIAN PROFILE',
        about: 'About the Musician',
        snapshot: 'Musician Snapshot',
        details: [['instruments','Instrument(s) / Role'],['experience','Experience'],['lookingForBand','Looking for a band']],
        badges: ['instruments','location']
      },
      venue: {
        kicker: 'VENUE PROFILE',
        about: 'About the Venue',
        snapshot: 'Venue Snapshot',
        details: [['venueType','Venue type'],['capacity','Capacity'],['venueBooking','Booking information']],
        badges: ['venueType','location']
      },
      fan: {
        kicker: 'FAN PROFILE',
        about: 'About This Fan',
        snapshot: 'Fan Snapshot',
        details: [['favoriteGenres','Favorite genres'],['fanInterests','Interests']],
        badges: ['favoriteGenres','location']
      }
    };

    const initialsFor = (name) => {
      const parts = (name || '').trim().split(/\s+/).filter(Boolean).slice(0,2);
      return parts.map((part) => part[0]).join('').toUpperCase() || 'BT';
    };

    function addDetail(label, value) {
      if (!value) return false;
      const item = document.createElement('div');
      item.className = 'profile-detail';
      const heading = document.createElement('strong');
      heading.textContent = label;
      const text = document.createElement('span');
      text.textContent = value;
      item.append(heading,text);
      document.getElementById('profile-details').appendChild(item);
      return true;
    }

    function addLink(label,url) {
      if (!url) return false;
      const link = document.createElement('a');
      link.href = url;
      link.target = '_blank';
      link.rel = 'noopener';
      link.className = 'auth-button';
      link.style.textDecoration = 'none';
      link.textContent = label;
      document.getElementById('profile-links').appendChild(link);
      return true;
    }

    function addBadge(value) {
      if (!value) return;
      const badge = document.createElement('span');
      badge.className = 'profile-badge';
      badge.textContent = value;
      document.getElementById('profile-badges').appendChild(badge);
    }

    async function loadProfile(user) {
      signedInUser = user;
      if (!profileId) { status.textContent = 'No profile was selected.'; return; }

      try {
        const snapshot = await getDoc(doc(db,'profiles',profileId));
        if (!snapshot.exists() || snapshot.data().published !== true) {
          status.textContent = 'This profile is not available.';
          return;
        }

        loadedProfile = snapshot.data();
        const accountType = loadedProfile.accountType || 'fan';
        const layout = layouts[accountType] || layouts.fan;
        document.body.classList.add(`profile-type-${accountType}`);
        document.title = `${loadedProfile.displayName || 'Profile'} | BANDtroductions`;
        document.getElementById('profile-name').textContent = loadedProfile.displayName || 'BANDtroductions Member';
        document.getElementById('profile-type').textContent = layout.kicker;
        document.getElementById('profile-location').textContent = loadedProfile.location || '';
        document.getElementById('profile-bio').textContent = loadedProfile.bio || 'No bio has been added yet.';
        document.getElementById('about-heading').textContent = layout.about;
        document.getElementById('snapshot-heading').textContent = layout.snapshot;

        const avatar = document.getElementById('profile-avatar');
        avatar.textContent = initialsFor(loadedProfile.displayName);
        if (loadedProfile.imageUrl) {
          const image = document.createElement('img');
          image.src = loadedProfile.imageUrl;
          image.alt = `${loadedProfile.displayName || 'Member'} profile image`;
          image.addEventListener('error', () => image.replaceWith(initialsFor(loadedProfile.displayName)));
          avatar.replaceChildren(image);
        }

        layout.badges.forEach((key) => addBadge(loadedProfile[key]));
        let detailCount = 0;
        layout.details.forEach(([key,label]) => { if (addDetail(label,loadedProfile[key])) detailCount += 1; });
        document.getElementById('empty-details').hidden = detailCount > 0;

        let linkCount = 0;
        if (addLink('Visit Website',loadedProfile.website)) linkCount += 1;
        if (addLink(accountType === 'venue' ? 'View Media' : 'Listen / Watch',loadedProfile.mediaLink)) linkCount += 1;
        document.getElementById('empty-links').hidden = linkCount > 0;

        if (user) {
          const ownProfileSnapshot = await getDoc(doc(db,'profiles',user.uid));
          const ownUserSnapshot = await getDoc(doc(db,'users',user.uid));
          signedInProfile = ownProfileSnapshot.exists() ? ownProfileSnapshot.data() : (ownUserSnapshot.exists() ? ownUserSnapshot.data() : {});
          shareButton.hidden = false;
          if (user.uid === profileId) document.getElementById('edit-profile').hidden = false;
        }

        status.hidden = true;
        card.hidden = false;
      } catch (error) {
        console.error(error);
        status.textContent = 'We could not load this profile.';
      }
    }

    shareButton.addEventListener('click', () => {
      sharePanel.hidden = false;
      document.getElementById('share-message').focus();
    });

    document.getElementById('cancel-share').addEventListener('click', () => {
      sharePanel.hidden = true;
      shareStatus.textContent = '';
    });

    document.getElementById('confirm-share').addEventListener('click', async () => {
      if (!signedInUser || !signedInProfile || !loadedProfile) return;
      const button = document.getElementById('confirm-share');
      const customMessage = document.getElementById('share-message').value.trim();
      button.disabled = true;
      shareStatus.textContent = 'Sharing profile…';
      try {
        await addDoc(collection(db,'posts'), {
          authorId:signedInUser.uid,
          authorName:signedInProfile.displayName || signedInUser.displayName || 'BANDtroductions Member',
          accountType:signedInProfile.accountType || 'member',
          category:'shared-profile',
          content:customMessage || `Check out ${loadedProfile.displayName || 'this profile'} on BANDtroductions.`,
          linkUrl:`${window.location.origin}${window.location.pathname}?id=${encodeURIComponent(profileId)}`,
          imageUrl:'',
          sharedProfile:{
            id:profileId,
            displayName:loadedProfile.displayName || 'BANDtroductions Profile',
            accountType:loadedProfile.accountType || 'member',
            location:loadedProfile.location || '',
            genre:loadedProfile.genre || loadedProfile.favoriteGenres || '',
            imageUrl:loadedProfile.imageUrl || ''
          },
          published:true,
          createdAt:serverTimestamp(),
          updatedAt:serverTimestamp()
        });
        window.location.href = 'community.html';
      } catch (error) {
        console.error(error);
        shareStatus.textContent = error.code === 'permission-denied' ? 'Sharing permissions are not enabled yet.' : 'This profile could not be shared.';
        button.disabled = false;
      }
    });

    onAuthStateChanged(auth,(user) => loadProfile(user));
  </script>
</body>
</html>
