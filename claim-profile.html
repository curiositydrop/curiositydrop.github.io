<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Claim Profile | BANDtroductions</title>
  <link rel="stylesheet" href="style.css?v=7">
  <link rel="stylesheet" href="auth.css?v=14">
  <style>
    .claim-shell{width:min(calc(100vw - 20px),720px);margin:0 auto;padding:20px 0 44px}
    .claim-card{border:1px solid #3b3b3b;border-radius:18px;background:linear-gradient(145deg,#191919,#101010);padding:18px}
    .claim-summary{display:flex;gap:14px;align-items:center;padding:12px;border:1px solid #333;border-radius:14px;background:#0c0c0c;margin:14px 0}
    .claim-image{width:78px;height:78px;border-radius:14px;border:1px solid #0ccfbd;object-fit:cover;background:#080808}
    .claim-note{color:#aaa;line-height:1.55}
    .claim-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
    .claim-actions .auth-button{width:auto!important}
  </style>
</head>
<body class="hamburger-active auth-page">
  <div id="global-header"></div>

  <main class="claim-shell">
    <section class="claim-card">
      <p class="profile-meta">PROFILE OWNERSHIP</p>
      <h1>Claim This Profile</h1>
      <p class="auth-subtitle">Create or log in using the same email address already associated with the existing profile.</p>

      <div id="claim-summary" class="claim-summary"></div>
      <p id="claim-status" class="auth-message">Checking your account…</p>

      <div id="claim-controls" hidden>
        <p class="claim-note">Your account email matches this legacy profile. Finalizing will connect the existing profile to your account and make it editable.</p>
        <div class="claim-actions">
          <button id="claim-button" class="auth-button" type="button">Finalize Claim</button>
          <a class="auth-button auth-button-secondary" href="javascript:history.back()">Cancel</a>
        </div>
      </div>
    </section>
  </main>

  <div id="global-footer"></div>
  <script src="global.js?v=16"></script>
  <script type="module" src="claim-profile.js?v=11"></script>
</body>
</html>
