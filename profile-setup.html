<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set Up Profile | BANDtroductions</title>
  <link rel="stylesheet" href="style.css?v=7">
  <link rel="stylesheet" href="auth.css?v=1">
</head>
<body class="hamburger-active auth-page">
  <div id="global-header"></div>

  <main class="auth-shell">
    <section class="auth-form">
      <h1>Set Up Your Profile</h1>
      <p id="setup-message" class="auth-subtitle">Loading your account type…</p>

      <div id="setup-preview" hidden>
        <p>Your account is connected correctly.</p>
        <p>The full self-editing profile form for your account type is the next piece being built.</p>
        <a class="auth-button" href="index.html" style="display:inline-flex; text-decoration:none; justify-content:center; margin-top:16px;">Return to Test Site</a>
      </div>

      <p id="setup-status" class="auth-message" role="status"></p>
    </section>
  </main>

  <div id="global-footer"></div>
  <script src="global.js?v=2"></script>
  <script type="module">
    import { auth, db } from './firebase-dev.js';
    import { onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js';
    import { doc, getDoc } from 'https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js';

    const message = document.getElementById('setup-message');
    const preview = document.getElementById('setup-preview');
    const status = document.getElementById('setup-status');

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.href = 'login.html';
        return;
      }

      try {
        const snapshot = await getDoc(doc(db, 'users', user.uid));
        const data = snapshot.exists() ? snapshot.data() : {};
        const accountType = data.accountType || 'member';
        message.textContent = `Your ${accountType} profile setup is ready for the next build stage.`;
        preview.hidden = false;
      } catch (error) {
        console.error(error);
        status.textContent = 'We could not load your account information.';
      }
    });
  </script>
</body>
</html>
