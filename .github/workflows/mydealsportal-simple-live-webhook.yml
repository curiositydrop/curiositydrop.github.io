name: MyDealsPortal simple live webhook deploy
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mydealsportal/billing-live-readiness
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: mydealsportal-backend
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: Verify single-function live entrypoint
        run: |
          node --check mydealsportal-backend/index-live-simple.js
          grep -q 'myDealsLiveStripeWebhook' mydealsportal-backend/index-live-simple.js
          ! grep -q 'sk_live_[A-Za-z0-9]' mydealsportal-backend/index-live-simple.js
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/423834035461/locations/global/workloadIdentityPools/mydealsportal-github-deploy/providers/mydealsportal-github
          service_account: mydealsportal-github-deploy@mydealsportal.iam.gserviceaccount.com
      - name: Install Firebase CLI
        run: npm install --global firebase-tools
      - name: Stage only minimal live webhook entrypoint
        run: cp mydealsportal-backend/index-live-simple.js mydealsportal-backend/index.js
      - name: Deploy single live webhook (no sandbox or other payment functions)
        run: firebase deploy --project mydealsportal --only functions:mydealsportal:myDealsLiveStripeWebhook --non-interactive
