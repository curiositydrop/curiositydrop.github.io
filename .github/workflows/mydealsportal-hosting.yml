name: MyDealsPortal Firebase Hosting (manual)

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Authenticate to Google Cloud (keyless GitHub OIDC)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: 'projects/423834035461/locations/global/workloadIdentityPools/mydealsportal-github-deploy/providers/mydealsportal-github'
          service_account: 'mydealsportal-github-deploy@mydealsportal.iam.gserviceaccount.com'
      - name: Install Firebase CLI
        run: npm install --global firebase-tools
      - name: Deploy MyDealsPortal standalone website
        run: firebase deploy --project mydealsportal --only hosting --non-interactive
