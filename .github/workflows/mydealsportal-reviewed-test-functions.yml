name: MyDealsPortal reviewed sandbox Functions deploy

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy-test-functions:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout fixed reviewed billing snapshot
        uses: actions/checkout@v5
        with:
          ref: 56beb5c095293d130027c261741930bf289ba30a
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install backend dependencies
        working-directory: mydealsportal-backend
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: Verify billing code
        working-directory: mydealsportal-backend
        run: npm run check && npm test
      - name: Verify sandbox entrypoint excludes live Stripe configuration
        run: |
          node --check mydealsportal-backend/index-sandbox.js
          if grep -q 'MYDEALSPORTAL_STRIPE_LIVE_' mydealsportal-backend/index-sandbox.js; then exit 1; fi
      - name: Authenticate to Firebase
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: 'projects/423834035461/locations/global/workloadIdentityPools/mydealsportal-github-deploy/providers/mydealsportal-github'
          service_account: 'mydealsportal-github-deploy@mydealsportal.iam.gserviceaccount.com'
      - name: Install Firebase CLI
        run: npm install --global firebase-tools
      - name: Switch staging build to sandbox-only entrypoint
        run: cp mydealsportal-backend/index-sandbox.js mydealsportal-backend/index.js
      - name: Deploy MyDealsPortal Functions only
        run: firebase deploy --project mydealsportal --only functions:mydealsportal:sandboxCheckout,functions:mydealsportal:stripeSandboxWebhook --non-interactive
