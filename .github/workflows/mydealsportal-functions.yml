name: MyDealsPortal Firebase Functions (manual)

on:
  pull_request:
    paths:
      - 'mydealsportal-backend/**'
      - '.github/workflows/mydealsportal-functions.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Verification only (safe) or deploy functions'
        type: choice
        required: true
        default: verify
        options:
          - verify
          - deploy

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Authenticate to Google Cloud (deploy only)
        if: ${{ inputs.mode == 'deploy' }}
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: 'projects/423834035461/locations/global/workloadIdentityPools/mydealsportal-github-deploy/providers/mydealsportal-github'
          service_account: 'mydealsportal-github-deploy@mydealsportal.iam.gserviceaccount.com'
      - name: Install Firebase CLI (deploy only)
        if: ${{ inputs.mode == 'deploy' }}
        run: npm install --global firebase-tools
      - name: Install backend dependencies
        working-directory: mydealsportal-backend
        run: npm install --no-audit --no-fund
      - name: Validate JavaScript
        working-directory: mydealsportal-backend
        run: npm run check
      - name: Validate business signup and deal client syntax
        run: node --check mydealsportal-preview/firebase-client.js
      - name: Test billing policy
        working-directory: mydealsportal-backend
        run: npm test
      - name: Verify Google Cloud authentication (deploy only)
        if: ${{ inputs.mode == 'deploy' }}
        run: gcloud auth print-access-token >/dev/null
      - name: Deploy only MyDealsPortal Functions
        if: ${{ inputs.mode == 'deploy' }}
        run: firebase deploy --project mydealsportal --only functions:mydealsportal --non-interactive
