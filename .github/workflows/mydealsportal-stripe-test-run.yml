name: MyDealsPortal Stripe test promotion (manual)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Run diagnostics first; only select apply after review"
        required: true
        default: diagnose
        type: choice
        options:
          - diagnose
          - apply
      confirmation:
        description: "Type APPLY_TEST_ONLY to apply promotion to the specific test subscription"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: mydealsportal-test-stripe-promotion
  cancel-in-progress: false

jobs:
  test-only:
    if: ${{ inputs.mode == 'diagnose' || (inputs.mode == 'apply' && inputs.confirmation == 'APPLY_TEST_ONLY') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout reviewed, immutable development snapshot
        uses: actions/checkout@v5
        with:
          ref: 325c95b18ca8fc3a668d8f8f9515a32729c87bb8
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install backend dependencies without lifecycle scripts
        working-directory: mydealsportal-backend
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: Verify billing checks and tests
        working-directory: mydealsportal-backend
        run: npm run check && npm test
      - name: Verify Stripe secret format without revealing it
        working-directory: mydealsportal-backend
        env:
          MYDEALSPORTAL_STRIPE_TEST_KEY: ${{ secrets.MYDEALSPORTAL_STRIPE_TEST_KEY }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const raw = process.env.MYDEALSPORTAL_STRIPE_TEST_KEY || '';
          if (!raw) {
            console.error('CHECK FAILED: repository secret is missing or unavailable to this workflow.');
            process.exit(1);
          }
          if (raw !== raw.trim()) {
            console.error('CHECK FAILED: stored secret contains leading or trailing whitespace.');
            process.exit(1);
          }
          if (raw.startsWith('rk_test_')) {
            console.error('CHECK FAILED: this is a restricted test key (rk_test_), not an sk_test_ key.');
            process.exit(1);
          }
          if (raw.startsWith('sk_live_') || raw.startsWith('rk_live_')) {
            console.error('CHECK FAILED: live-mode key supplied. No Stripe operations attempted.');
            process.exit(1);
          }
          if (!raw.startsWith('sk_test_')) {
            console.error('CHECK FAILED: secret is present but does not begin with sk_test_.');
            process.exit(1);
          }
          console.log('Secret format verified: sk_test_ prefix, no surrounding whitespace. Value hidden.');
          NODE
      - name: Apply to John Wick's test subscription only
        if: ${{ inputs.mode == 'apply' && inputs.confirmation == 'APPLY_TEST_ONLY' }}
        working-directory: mydealsportal-backend
        env:
          MYDEALSPORTAL_STRIPE_TEST_KEY: ${{ secrets.MYDEALSPORTAL_STRIPE_TEST_KEY }}
          MYDEALSPORTAL_TEST_PROMOTION_CONFIRM: APPLY_TEST_ONLY
        run: npm run stripe:test:apply-promotion
