name: MyDealsPortal production readiness
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript
        run: |
          node --check mydealsportal-backend/index.js
          node --check mydealsportal-backend/live-billing.js
      - name: Authenticate deploy account
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/423834035461/locations/global/workloadIdentityPools/mydealsportal-github-deploy/providers/mydealsportal-github
          service_account: mydealsportal-github-deploy@mydealsportal.iam.gserviceaccount.com
      - name: Check production secrets without revealing values
        run: |
          gcloud config set project mydealsportal
          for secret in MDP_LIVE_STRIPE_SECRET_KEY MDP_LIVE_STRIPE_WEBHOOK_SECRET; do
            if gcloud secrets describe "$secret" --project=mydealsportal >/dev/null 2>&1; then
              echo "$secret: configured"
            else
              echo "::error::$secret is missing or not accessible to deployment account"
              exit 1
            fi
          done
      - name: Verify Firebase function dependencies
        working-directory: mydealsportal-backend
        run: npm install --no-audit --no-fund && npm run check
