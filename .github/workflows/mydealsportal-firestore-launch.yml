name: MyDealsPortal Firestore launch safety
# Retry production security deployment after adding Rules and Index Admin roles.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mydealsportal/billing-live-readiness
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install emulator testing dependencies
        working-directory: mydealsportal-backend
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: Test Firestore permissions
        working-directory: mydealsportal-backend
        run: npm run test:firestore:emulator
      - name: Checkout production branch for deployment
        uses: actions/checkout@v4
        with:
          ref: main
          clean: true
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/423834035461/locations/global/workloadIdentityPools/mydealsportal-github-deploy/providers/mydealsportal-github
          service_account: mydealsportal-github-deploy@mydealsportal.iam.gserviceaccount.com
      - name: Verify deployment identity and project
        run: |
          echo 'Project: mydealsportal'
          gcloud config set project mydealsportal
          gcloud auth print-access-token >/dev/null
          echo 'GitHub Google Cloud authentication succeeded'
      - name: Install Firebase CLI
        run: npm install --global firebase-tools
      - name: Deploy Firestore security rules and index (no Functions)
        run: firebase deploy --project mydealsportal --only firestore:rules,firestore:indexes --non-interactive
