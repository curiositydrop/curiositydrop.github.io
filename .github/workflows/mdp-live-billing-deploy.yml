name: Deploy MyDealsPortal live billing functions
on:
  workflow_dispatch:
    inputs:
      confirm_production:
        description: 'Type DEPLOY-LIVE-BILLING only after Stripe secrets and webhook destination are configured'
        required: true
        type: string
permissions:
  contents: read
  id-token: write
jobs:
  deploy:
    if: inputs.confirm_production == 'DEPLOY-LIVE-BILLING'
    runs-on: ubuntu-latest
    environment: mydealsportal-production
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check billing code
        run: |
          node --check mydealsportal-backend/index.js
          node --check mydealsportal-backend/live-billing.js
      - name: Authenticate Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/423834035461/locations/global/workloadIdentityPools/mydealsportal-github-deploy/providers/mydealsportal-github
          service_account: mydealsportal-github-deploy@mydealsportal.iam.gserviceaccount.com
      - name: Verify production secrets exist
        run: |
          gcloud config set project mydealsportal
          gcloud secrets describe MDP_LIVE_STRIPE_SECRET_KEY --project=mydealsportal >/dev/null
          gcloud secrets describe MDP_LIVE_STRIPE_WEBHOOK_SECRET --project=mydealsportal >/dev/null
      - name: Install dependencies
        working-directory: mydealsportal-backend
        run: npm install --no-audit --no-fund
      - name: Install Firebase CLI
        run: npm install -g firebase-tools
      - name: Deploy production functions only
        run: |
          firebase deploy --project mydealsportal --only \
            functions:mydealsportal:liveCheckout,\
            functions:mydealsportal:liveStripeWebhook,\
            functions:mydealsportal:approveNewPaidDeal \
            --non-interactive
